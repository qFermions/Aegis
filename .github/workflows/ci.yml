name: CI

# Every declared check on every pull request and on every push to main (REVIEW.md, CLAUDE.md "Review").
# Pattern-only by design: no secret value reaches any job. The release-gate workflow keeps the
# two-OS test and scanner run; this workflow adds the rest of the declared battery and the risk tier.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install
        # The repository declares no package manifest today. The day one lands, npm ci installs from its
        # lockfile with lifecycle scripts off (pattern-only CI). A manifest without a lockfile fails
        # closed: dependency manifests and lockfiles are tier C (REVIEW.md) and npm install would
        # write an untracked lockfile that the release-boundary step rejects.
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts
          elif [ -f package.json ]; then echo "::error::package.json without package-lock.json: commit the lockfile (REVIEW.md, tier C)"; exit 1
          else echo "no package manifest, nothing to install"; fi

      - name: Prerequisite check (PowerShell is required by the safety-gate tests)
        run: pwsh -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Test suite
        run: node --test

      - name: Command structure lint
        run: node scripts/lint/command-structure.js

      - name: Full-tree scan (PII, credentials, secret formats)
        run: node scripts/pre-commit-check.js --all

      - name: Release boundary
        run: node scripts/harness/release-boundary-check.js

  risk-tier:
    name: risk-tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Compute the risk tier against the base
        # Pull request: the target branch. Push: the commit before the push, so a merge to main
        # reports the tier of what landed. When that commit is unreachable (history rewritten,
        # shallow checkout, first commit) there is no trustworthy base and the job fails closed,
        # as it does on any script error (missing base, unreadable tier file).
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            base="origin/${BASE_REF}"
          elif [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            echo "::error::risk-tier: the pushed-from commit (${BEFORE:-unset}) is unreachable on ${DEFAULT_BRANCH} (history rewrite, shallow checkout or first commit); no trustworthy base, failing closed"
            exit 1
          fi
          out="$(node scripts/risk_tier.mjs "$base")"
          printf '%s\n' "$out"
          {
            echo "## Risk tier (base: ${base})"
            echo
            echo '```'
            printf '%s\n' "$out"
            echo '```'
            echo
            echo 'Tiers are defined in .github/risk-tiers.json and explained in REVIEW.md.'
          } >> "$GITHUB_STEP_SUMMARY"

  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_evals: ${{ steps.probe.outputs.has_evals }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Probe for the eval scripts
        id: probe
        run: |
          if [ -f scripts/eval/ms-ticket-eval.js ] && [ -f scripts/eval/gws-ticket-eval.js ] && [ -f scripts/eval/g2-ticket-eval.js ] && [ -f scripts/eval/g3-ticket-eval.js ] && [ -f scripts/replay/replay-demo.js ]; then
            echo "has_evals=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_evals=false" >> "$GITHUB_OUTPUT"
          fi

  evals:
    name: "${{ needs.detect.outputs.has_evals == 'true' && 'evals' || 'evals (skipped - eval scripts missing)' }}"
    needs: [verify, detect]
    if: needs.detect.outputs.has_evals == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Microsoft ticket eval
        run: node scripts/eval/ms-ticket-eval.js

      - name: Google Workspace / Okta / Jamf ticket eval
        run: node scripts/eval/gws-ticket-eval.js

      - name: G2 ticket eval (Google Workspace, Fleet, Jamf, Slack, Linear; counts per platform)
        run: node scripts/eval/g2-ticket-eval.js

      - name: G3 ticket eval (Okta, Microsoft 365, ambiguous tickets, the four intake sources; minimums)
        run: node scripts/eval/g3-ticket-eval.js

      - name: Replay lifecycle demo
        run: node scripts/replay/replay-demo.js

      - name: Judged-eval runner dry run (the DEV set copied out of the repository; no model is started)
        run: |
          cp scripts/eval/judged/dev-cases.jsonl "$RUNNER_TEMP/dev-cases.jsonl"
          set +e
          node scripts/eval/judged-eval.js run --cases "$RUNNER_TEMP/dev-cases.jsonl"
          code=$?
          set -e
          echo "exit $code (4 is a dry run)"
          test "$code" -eq 4
