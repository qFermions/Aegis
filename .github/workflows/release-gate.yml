name: Release Gate

# The same scanner that gates local commits, run across the full checked-out tree
# on every push and PR — "the release gate ran once" becomes "the release
# gate runs publicly, forever." See EVALUATE.md probe 4 to fire it yourself.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests and full-tree scan (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the full tree
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run the repository test suite
        run: node --test

      - name: Scan full working tree (PII, credentials, secret formats, injection markers)
        # Pattern-only by design — no secrets reach this job. PR-triggered runs
        # execute workspace code, so the tenant-literal overlay (SR-8) stays
        # private-side; the scanner skips it cleanly when unset.
        run: node scripts/pre-commit-check.js --all
