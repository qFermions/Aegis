<text x="743" y="32" text-anchor="middle" fill="#3fb950" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:12px">advice only · nothing was changed</text></g>
<g class="cmd"><text x="30" y="78" textLength="358.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#3fb950">$ </tspan><tspan fill="#e6edf3">node scripts/ask-aegis.js </tspan><tspan fill="#ff7b72">--reply-to asker</tspan><tspan fill="#8b949e"> \</tspan></text><g class="type0"><rect x="45.6" y="63" width="383.2" height="21" fill="#0d1117"/><rect class="caret0" x="45.6" y="65" width="7.8" height="16" fill="#e6edf3"/></g><text x="30" y="99" textLength="499.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#e6edf3">    </tspan><tspan fill="#a5d6ff">"Nobody at the second office can get into Outlook or Teams \</tspan></text><g class="type1"><rect x="30.0" y="84" width="539.2" height="21" fill="#0d1117"/><rect class="caret1" x="30.0" y="86" width="7.8" height="16" fill="#e6edf3"/></g><text x="30" y="120" textLength="452.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#e6edf3">     </tspan><tspan fill="#a5d6ff">since about 10 this morning. Head office seems fine."</tspan></text><g class="type2"><rect x="30.0" y="105" width="492.4" height="21" fill="#0d1117"/><rect class="caret2" x="30.0" y="107" width="7.8" height="16" fill="#e6edf3"/></g></g>
<g class="p0"><text x="30" y="151" textLength="678.6" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">Something at your office seems to be blocking Outlook and Teams. It doesn't look like a</text><text x="30" y="172" textLength="553.8" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">problem with anyone's account, because head office is working normally.</text></g><g class="p1"><text x="30" y="202" textLength="678.6" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">So far I've only read your message. I haven't confirmed the cause yet: it could be your</text><text x="30" y="223" textLength="592.8" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">office's internet connection, its link to head office, or a network setting.</text></g><g class="p2"><text x="30" y="253" textLength="717.6" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">For now, you can use Teams or Outlook on a phone with Wi-Fi switched off, or call colleagues</text><text x="30" y="274" textLength="694.2" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">directly. A technician will check your office's network connection next and will tell you</text><text x="30" y="295" textLength="179.4" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">once things work again.</text></g><text class="s0" x="30" y="331" textLength="312.0" lengthAdjust="spacingAndGlyphs" fill="#8b949e">Reply saved: ~/aegis-asks/&lt;ask&gt;/reply.md</text><text class="s1" x="30" y="352" textLength="405.6" lengthAdjust="spacingAndGlyphs" fill="#8b949e">Full tech answer saved: ~/aegis-asks/&lt;ask&gt;/answer.md</text><text class="s2" x="30" y="373" textLength="163.8" lengthAdjust="spacingAndGlyphs" fill="#8b949e">Cost: 0.23 US dollars</text><text class="s3" x="30" y="394" textLength="624.0" lengthAdjust="spacingAndGlyphs" fill="#3fb950">The reply passed its form check. It is text for you to send; Aegis sent nothing.</text>
</g>
</svg>
