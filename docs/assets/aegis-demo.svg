eyframes p2{0%,57.78%{opacity:0;transform:translateY(6px)}60.56%,93.33%{opacity:1;transform:translateY(0)}96.67%,100%{opacity:0;transform:translateY(0)}}.s0{animation:s0 18.0s infinite}@keyframes s0{0%,66.67%{opacity:0}68.33%,93.33%{opacity:1}96.67%,100%{opacity:0}}.s1{animation:s1 18.0s infinite}@keyframes s1{0%,68.89%{opacity:0}70.56%,93.33%{opacity:1}96.67%,100%{opacity:0}}.s2{animation:s2 18.0s infinite}@keyframes s2{0%,71.11%{opacity:0}72.78%,93.33%{opacity:1}96.67%,100%{opacity:0}}.s3{animation:s3 18.0s infinite}@keyframes s3{0%,74.44%{opacity:0}76.11%,93.33%{opacity:1}96.67%,100%{opacity:0}}.cmd{animation:cmd 18.0s infinite}@keyframes cmd{0%,93.33%{opacity:1}96.67%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><clipPath id="screen"><rect x="10" y="10" width="860" height="420" rx="12"/></clipPath></defs>
<rect x="10" y="10" width="860" height="420" rx="12" fill="#0d1117" stroke="#30363d"/>
<g clip-path="url(#screen)">
<rect x="10" y="10" width="860" height="36" fill="#161b22"/>
<line x1="10" y1="46" x2="870" y2="46" stroke="#30363d"/>
<circle cx="32" cy="28" r="6" fill="#ff5f57"/><circle cx="52" cy="28" r="6" fill="#febc2e"/><circle cx="72" cy="28" r="6" fill="#28c840"/>
<text class="ui" x="440.0" y="33" text-anchor="middle" fill="#8b949e" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:13px">Aegis · the reply to the person who asked</text>
<g class="wait"><rect x="630" y="17" width="226" height="22" rx="11" fill="#1f6feb" fill-opacity="0.18" stroke="#1f6feb" stroke-opacity="0.6"/>
<text x="643" y="32" fill="#79c0ff" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:12px">Aegis is reading its runbooks</text>
<circle class="dot" cx="830" cy="28" r="2.5" fill="#79c0ff"/><circle class="dot" style="animation-delay:.2s" cx="838" cy="28" r="2.5" fill="#79c0ff"/><circle class="dot" style="animation-delay:.4s" cx="846" cy="28" r="2.5" fill="#79c0ff"/></g>
