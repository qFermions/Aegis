<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-labelledby="ft fd">
<title id="ft">How a ticket moves through Aegis</title>
<desc id="fd">Five steps: 1, a ticket in plain words. 2, Aegis reads its runbooks and read-only checks. 3, two answers: a Fix card for the IT tech and a reply for the person who asked. 4, a person makes the change. 5, Aegis checks it really worked. Aegis cannot change accounts, devices or tickets itself.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}.flowline{stroke-dasharray:6 6;animation:flowline 1s linear infinite}@keyframes flowline{to{stroke-dashoffset:-12}}.hl_ticket{opacity:0;animation:hl_ticket 10.0s infinite}@keyframes hl_ticket{0%{opacity:1}12.0%{opacity:0}100%{opacity:0}}.hl_reads{opacity:0;animation:hl_reads 10.0s infinite}@keyframes hl_reads{0%,17.7%{opacity:0}20.7%{opacity:1}31.7%,100%{opacity:0}}.hl_card{opacity:0;animation:hl_card 10.0s infinite}@keyframes hl_card{0%,38.0%{opacity:0}41.0%{opacity:1}52.0%,100%{opacity:0}}.hl_reply{opacity:0;animation:hl_reply 10.0s infinite}@keyframes hl_reply{0%,38.0%{opacity:0}41.0%{opacity:1}52.0%,100%{opacity:0}}.hl_human{opacity:0;animation:hl_human 10.0s infinite}@keyframes hl_human{0%,58.3%{opacity:0}61.3%{opacity:1}72.3%,100%{opacity:0}}.hl_check{opacity:0;animation:hl_check 10.0s infinite}@keyframes hl_check{0%,78.0%{opacity:0}81.0%{opacity:1}92.0%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
