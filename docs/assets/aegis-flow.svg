="1.5"/><rect class="hl_card" x="363" y="33" width="156" height="82" rx="14" fill="none" stroke="#58a6ff" stroke-width="3"/><circle cx="384" cy="54" r="10" fill="#1f6feb"/><text x="384" y="58.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text><text x="449.0" y="71.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Fix card</text><text x="449.0" y="89.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9da7b3">for the IT tech</text><rect x="366" y="144" width="150" height="76" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect class="hl_reply" x="363" y="141" width="156" height="82" rx="14" fill="none" stroke="#58a6ff" stroke-width="3"/><circle cx="384" cy="162" r="10" fill="#1f6feb"/><text x="384" y="166.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text><text x="449.0" y="170.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Reply</text><text x="449.0" y="188.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9da7b3">for the person</text><text x="449.0" y="206.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9da7b3">who asked</text><rect x="542" y="80" width="150" height="96" rx="12" fill="#161b22" stroke="#d29922" stroke-width="1.5"/><rect class="hl_human" x="539" y="77" width="156" height="102" rx="14" fill="none" stroke="#58a6ff" stroke-width="3"/><circle cx="560" cy="98" r="10" fill="#d29922"/><text x="560" y="102.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text><text x="625.0" y="125.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">A person</text><text x="625.0" y="143.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9da7b3">makes the change</text><rect x="718" y="80" width="150" height="96" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><rect class="hl_check" x="715" y="77" width="156" height="102" rx="14" fill="none" stroke="#58a6ff" stroke-width="3"/><circle cx="736" cy="98" r="10" fill="#1f6feb"/><text x="736" y="102.5" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text><text x="801.0" y="125.0" text-anchor="middle" font-size="15" font-weight="700" fill="#e6edf3">Aegis checks</text><text x="801.0" y="143.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#9da7b3">it really worked</text>
<text x="440.0" y="258" text-anchor="middle" font-size="13" fill="#8b949e">Aegis advises. Step 4 is always a person: Aegis cannot change accounts, devices or tickets.</text>
